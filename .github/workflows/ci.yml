name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install libusb and udev runtimes
        run: sudo apt-get update && sudo apt-get install --yes libusb-1.0-0 libudev1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Verify lock file
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --frozen --python ${{ matrix.python }}

      - name: Run lint
        run: uv run --frozen ruff check src tests scripts examples

      - name: Run tests
        run: uv run --frozen pytest tests -q

      - name: Build wheel and source distribution
        run: uv build

  binary:
    name: PyInstaller binary
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install runtime and ELF inspection tools
        run: sudo apt-get update && sudo apt-get install --yes binutils file libusb-1.0-0 libudev1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Build single-file executable
        run: bash scripts/build_pyinstaller.sh

      - name: Smoke-test executable and embedded licenses
        run: |
          dist/realsense_camera --version | tee version-output.txt
          expected_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          grep -q "$expected_version" version-output.txt
          dist/realsense_camera licenses > license-output.txt
          grep -q 'Apache License' license-output.txt
          grep -q 'X-ERA' license-output.txt
          grep -q 'dora-rs' license-output.txt
          grep -q 'pyrealsense2' license-output.txt
          dist/realsense_camera init-device --help
          file dist/realsense_camera | grep -q 'ELF 64-bit LSB'
          readelf -h dist/realsense_camera
          readelf -l dist/realsense_camera
          readelf -d dist/realsense_camera
          readelf --version-info dist/realsense_camera
          ldd dist/realsense_camera
          test -s build/pyinstaller/elf-audit.json

      - name: Reject private build markers
        run: |
          if strings dist/realsense_camera | grep -F "$GITHUB_WORKSPACE"; then
            exit 1
          fi
          if strings dist/realsense_camera | grep -E '(git\+)?ssh://[^/[:space:]]+@([A-Za-z0-9][A-Za-z0-9._-]*|\[[A-Za-z0-9:.%_-]+\])'; then
            exit 1
          fi

  security:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Install audit interpreter
        run: uv python install 3.12

      - name: Export locked runtime dependencies
        run: uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements-txt --output-file requirements-audit.txt

      - name: Audit dependencies
        run: uvx --python 3.12 pip-audit --requirement requirements-audit.txt
