nodes:
  - id: realsense_camera
    path: uv
    inputs:
      tick: dora/timer/millis/33
    outputs:
      - image/color
      - image/depth
      - image/ir_left
      # sensor_node.yaml 默认关闭 infrared.right；需要右 IR 时两边一起打开
      # - image/ir_right
    args: run --project ../.. realsense_camera --config sensor_node.yaml

  - id: test_sink
    path: uv
    inputs:
      image/color: realsense_camera/image/color
      image/depth: realsense_camera/image/depth
      image/ir_left: realsense_camera/image/ir_left
      # image/ir_right: realsense_camera/image/ir_right
    args: run --project ../.. python test_sink.py --config test_sink.yaml
