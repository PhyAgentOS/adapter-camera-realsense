# RealSense D435 + 通用 Rust image_viewer（源码节点，四路：color / depth / ir_left / ir_right）
# 若聚焦窗口后画面停住但 Alt+Tab 预览仍在动，是 image_viewer 多窗口重绘问题。
# 运行：在 examples/realsense_camera_viewer 目录下
#   确保 image_viewer 已加入 PATH
#   dora build dataflow.yaml --uv && dora run dataflow.yaml --uv
#
# tick 与 realsense_camera.yaml 中 color/depth/infrared fps 对齐：改 realsense.inputs.tick 的 dora/timer/millis/<N>
#   N ≈ round(1000 / fps)
#   例：30fps → millis/33；15 → millis/67；10 → millis/100；5 → millis/200
# 只改 realsense_camera.yaml 里的 fps 而不改 tick：节点仍按原 tick 被唤醒；与旧 dataflow 模板行为一致。
#
# 若已用 PyInstaller 打包，请改用同目录 dataflow_binary.yaml（path 指向仓库根 dist/realsense_camera）。

nodes:
  - id: realsense_camera
    path: uv
    inputs:
      tick: dora/timer/millis/33
    outputs:
      - image/color
      - image/depth
      - image/ir_left
      - image/ir_right
    args: run --project ../.. realsense_camera --config realsense_camera.yaml

  - id: image_viewer
    path: image_viewer
    inputs:
      image/color: realsense_camera/image/color
      image/depth: realsense_camera/image/depth
      image/ir_left: realsense_camera/image/ir_left
      image/ir_right: realsense_camera/image/ir_right
